name: Build

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CACHE_VERSION: "2025-10-03"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ['windows', 'mac', 'ubuntu-24', 'ubuntu-24-clang']
        include:
          # Windows, MSVC
          - platform: "windows"
            compiler: "MSVC"
            runner: "windows-2022"
            name: "Windows"
            CMAKE_SYSTEM_VERSION: "10.0.20348.0"
            CMAKE_GENERATOR: "Visual Studio 17 2022"
            CMAKE_GENERATOR_PLATFORM: "x64"
          # MacOS, AppleClang
          - platform: "mac"
            compiler: "AppleClang"
            runner: "macos-latest"
            name: "Mac"
            XCODE_VERSION: "latest-stable"
            CMAKE_GENERATOR: "Xcode"
            CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
            CMAKE_OSX_ARCHITECTURES: "x86_64;arm64"
          # Ubuntu 24.04, GCC
          - platform: "ubuntu-24"
            compiler: "GCC-13"
            runner: "ubuntu-24.04"
            name: "Ubuntu 24.04 (GCC)"
            CMAKE_GENERATOR: "Ninja Multi-Config"
          # Ubuntu 24.04, Clang
          - platform: "ubuntu-24-clang"
            compiler: "Clang-18"
            runner: "ubuntu-24.04"
            name: "Ubuntu 24.04 (Clang)"
            CMAKE_GENERATOR: "Ninja Multi-Config"
    name: "${{ matrix.name}}"
    runs-on: "${{ matrix.runner }}"
    env:
      CMAKE_BUILD_TYPE: "RelWithDebInfo"
      CMAKE_GENERATOR: "${{ matrix.CMAKE_GENERATOR }}"
      CMAKE_GENERATOR_PLATFORM: "${{ matrix.CMAKE_GENERATOR_PLATFORM }}"
      CMAKE_SYSTEM_VERSION: "${{ matrix.CMAKE_SYSTEM_VERSION }}"
      CMAKE_OSX_DEPLOYMENT_TARGET: "${{ matrix.CMAKE_OSX_DEPLOYMENT_TARGET }}"
      CMAKE_OSX_ARCHITECTURES: "${{ matrix.CMAKE_OSX_ARCHITECTURES }}"
    steps:
    - name: "Clone"
      uses: "actions/checkout@v4"
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: "Install Compiler (Ubuntu)"
      if: ${{ startsWith(matrix.platform, 'ubuntu') }}
      shell: bash
      run: |
        # Install the appropriate compiler
        # - Split by '-' into separate parts
        IFS=$'-' read -a compiler <<< "${{ matrix.compiler }}"
        # - Check which compiler we're installing
        echo "Installing '${compiler[0]}' version ${compiler[1]}..."
        if [[ "${compiler[0]}" == "GCC" ]]; then
          # - We're installing/using GCC.
          sudo apt-get install binutils gcc-${compiler[1]} g++-${compiler[1]}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${compiler[1]} 800

          echo "CMAKE_C_COMPILER=gcc-${compiler[1]}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=g++-${compiler[1]}" >> "$GITHUB_ENV"
          echo "CMAKE_LINKER=gold" >> "$GITHUB_ENV"
        elif [[ "${compiler[0]}" == "Clang" ]]; then
          # - We're installing/using Clang.
          curl -jLo /tmp/llvm.sh "https://apt.llvm.org/llvm.sh"
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${compiler[1]} all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/lldb lldb /usr/bin/lldb-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-${compiler[1]} 800
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${compiler[1]} 800

          echo "CMAKE_C_COMPILER=clang-${compiler[1]}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++-${compiler[1]}" >> "$GITHUB_ENV"
          echo "CMAKE_LINKER=ld.lld-${compiler[1]}" >> "$GITHUB_ENV"
        else
          echo "Unknown Compiler"
          exit 1
        fi
    - name: "Install Compiler (Mac)"
      if: ${{ startsWith(matrix.platform, 'mac') }}
      run: |
        sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
    - name: "Install Packager (Windows)"
      if: startsWith( matrix.platform, 'windows' )
      run: |
        curl "-kL" "https://cdn.xaymar.com/ci/innosetup-6.3.3.exe" "-f" "--retry" "5" "-o" "inno.exe"
        .\inno.exe /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART
    - name: 'Install Packager (Mac)'
      continue-on-error: true
      if: startsWith( matrix.platform, 'mac' )
      shell: bash
      run: |
        curl -kL https://cdn.xaymar.com/ci/Packages-1.2.10.dmg -f --retry 5 -o "Packages.dmg"
        sudo hdiutil attach ./Packages.dmg
        pushd /Volumes/Packages*
        sudo installer -pkg ./Install\ Packages.pkg -target /
    - name: "Fetch"
      shell: bash
      run: |
        ./tools/build.sh fetch
    - name: "Gather"
      shell: bash
      run: |
        echo "OBS_VERSION=$(cd third-party/obs-studio/ && git describe --tags --long --abbrev=8 HEAD)" >> "${GITHUB_ENV}"
    - name: "Patch"
      shell: bash
      run: |
        ./tools/build.sh patch
    - name: "Prerequisites"
      shell: bash
      run: |
        ./tools/build.sh prerequisites
    - name: "libOBS: Restore Cache"
      id: libobs
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ github.workspace }}/third-party/obs-studio/.deps
          ${{ github.workspace }}/third-party/obs-studio/build/install
        key: "${{ secrets.CACHE_VERSION }}-${{ env.CACHE_VERSION }}-${{ env.OBS_VERSION }}-${{ matrix.platform }}-${{ matrix.compiler }}-libobs"
    - name: "libOBS"
      if: ${{ (steps.libobs.outputs.cache-hit != 'true') }}
      shell: bash
      run: |
        ./tools/build.sh libobs
    - name: "libOBS: Save Cache"
      if: ${{ (steps.libobs.outputs.cache-hit != 'true') }}
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ github.workspace }}/third-party/obs-studio/.deps
          ${{ github.workspace }}/third-party/obs-studio/build/install
        key: "${{ secrets.CACHE_VERSION }}-${{ env.CACHE_VERSION }}-${{ env.OBS_VERSION }}-${{ matrix.platform }}-${{ matrix.compiler }}-libobs"
    - name: "Build (Studio)"
      shell: bash
      env:
        feature-set: "Studio"
      run: |
        ./tools/build.sh configure \
          --build "${{ github.workspace }}/build" \
          --install "${{ github.workspace }}/build/install" \
          --package "${{ github.workspace }}/build/package" \
          --package-name "StreamFX ${{ env.feature-set }} ${{ matrix.name }} (for OBS Studio v${{ env.OBS_VERSION }}) v" \
          -DCOMPONENT_AUTO-FRAMING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DENOISING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_UPSCALING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_VIRTUAL_GREENSCREEN=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_COLOR_GRADE=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SDFFX=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SHADER=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_BLUR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DYNAMIC_MASK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_FFMPEG=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_MIRROR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SPOUT_SINK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_TRANSFORM=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }}
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh build \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh install \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
    - name: "Packaging (Studio)"
      if: startsWith( matrix.platform, 'windows' )
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /V10 ".\build\installer.iss"
    - name: "Packaging (Studio)"
      if: startsWith( matrix.platform, 'ubuntu' )
      shell: bash
      run: |
        if [[ ! -d "${{ github.workspace }}/build/package" ]]; then
          mkdir "${{ github.workspace }}/build/package"
        fi
        cmake --build "${{ github.workspace }}/build" --config RelWithDebInfo --target PACKAGE
    - name: "Packaging (Studio)"
      if: startsWith( matrix.platform, 'mac' )
      shell: bash
      run: |
        packagesbuild "${{ github.workspace }}/build/installer.pkgproj"
    - name: "Build (Creator)"
      shell: bash
      env:
        feature-set: "Creator"
      run: |
        ./tools/build.sh configure \
          --build "${{ github.workspace }}/build" \
          --install "${{ github.workspace }}/build/install" \
          --package "${{ github.workspace }}/build/package" \
          --package-name "StreamFX ${{ env.feature-set }} ${{ matrix.name }} (for OBS Studio v${{ env.OBS_VERSION }}) v" \
          -DCOMPONENT_AUTO-FRAMING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DENOISING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_UPSCALING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_VIRTUAL_GREENSCREEN=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_COLOR_GRADE=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SDFFX=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SHADER=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_BLUR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DYNAMIC_MASK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_FFMPEG=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_MIRROR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SPOUT_SINK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_TRANSFORM=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }}
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh build \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh install \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
    - name: "Packaging (Creator)"
      if: startsWith( matrix.platform, 'windows' )
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /V10 ".\build\installer.iss"
    - name: "Packaging (Creator)"
      if: startsWith( matrix.platform, 'ubuntu' )
      shell: bash
      run: |
        if [[ ! -d "${{ github.workspace }}/build/package" ]]; then
          mkdir "${{ github.workspace }}/build/package"
        fi
        cmake --build "${{ github.workspace }}/build" --config RelWithDebInfo --target PACKAGE
    - name: "Packaging (Creator)"
      if: startsWith( matrix.platform, 'mac' )
      shell: bash
      run: |
        packagesbuild "${{ github.workspace }}/build/installer.pkgproj"
    - name: "Build (Standard)"
      shell: bash
      env:
        feature-set: "Standard"
      run: |
        ./tools/build.sh configure \
          --build "${{ github.workspace }}/build" \
          --install "${{ github.workspace }}/build/install" \
          --package "${{ github.workspace }}/build/package" \
          --package-name "StreamFX ${{ env.feature-set }} ${{ matrix.name }} (for OBS Studio v${{ env.OBS_VERSION }}) v" \
          -DCOMPONENT_AUTO-FRAMING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DENOISING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_UPSCALING=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_VIRTUAL_GREENSCREEN=${{ (startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_COLOR_GRADE=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SDFFX=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SHADER=${{ (startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_BLUR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_DYNAMIC_MASK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_FFMPEG=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_MIRROR=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_SPOUT_SINK=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }} \
          -DCOMPONENT_TRANSFORM=${{ (startsWith(env.feature-set, 'Standard') || startsWith(env.feature-set, 'Creator') || startsWith(env.feature-set, 'Studio')) && 'ON' || 'OFF' }}
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh build \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
        ./tools/build.sh install \
          --build "${{ github.workspace }}/build"
        _r=$?; if [[ $_r != 0 ]]; then exit "$_r"; fi
    - name: "Packaging (Standard)"
      if: startsWith( matrix.platform, 'windows' )
      shell: cmd
      run: |
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /V10 ".\build\installer.iss"
    - name: "Packaging (Standard)"
      if: startsWith( matrix.platform, 'ubuntu' )
      shell: bash
      run: |
        if [[ ! -d "${{ github.workspace }}/build/package" ]]; then
          mkdir "${{ github.workspace }}/build/package"
        fi
        cmake --build "${{ github.workspace }}/build" --config RelWithDebInfo --target PACKAGE
    - name: "Packaging (Standard)"
      if: startsWith( matrix.platform, 'mac' )
      shell: bash
      run: |
        packagesbuild "${{ github.workspace }}/build/installer.pkgproj"
    - name: "Artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: "StreamFX (for OBS Studio v${{ env.OBS_VERSION }}, ${{ matrix.name }}, ${{ matrix.compiler }})"
        path: "${{ github.workspace }}/build/package"
        if-no-files-found: error
        compression-level: 0
